spring.application.name=liber-astartes

# Neo4j connection (docker-compose or reused local container)
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:password123}

# Server
server.port=8080

# Seed loading (set false to skip the CommandLineRunner)
liberastartes.seed.enabled=true
